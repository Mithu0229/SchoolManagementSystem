<div class="card">
    <div class="flex justify-content-between align-items-center mb-4">
        <h5 class="m-0">SMS History</h5>
    </div>

    <p-table [value]="smsHistory" [loading]="loading" [rows]="10" [paginator]="true" 
             responsiveLayout="scroll" styleClass="p-datatable-sm p-datatable-striped"
             [rowHover]="true">
        <ng-template pTemplate="header">
            <tr>
                <th style="min-width: 150px">Date</th>
                <th style="min-width: 150px">Phone</th>
                <th>Message</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-sms>
            <tr>
                <td>{{ sms.createdDate | date:'medium' }}</td>
                <td>{{ sms.phone }}</td>
                <td>{{ sms.message }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center">No SMS history found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
