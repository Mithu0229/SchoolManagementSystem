<div class="max-w-5xl mx-auto p-6">
    <!-- Page Header -->
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-semibold text-gray-800">Branch Registration</h2>
        <p class="text-gray-500 text-sm">Fill out the form below to register a new branch</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white shadow-md rounded-2xl p-8">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            
            <!-- Branch Admin Section -->
            <h3 class="text-lg font-medium text-gray-800 mb-4 border-b pb-2">Branch Admin</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- First Name -->
                <div>
                    <label class="form-label" for="firstName">First Name <span class="required-asterisk">*</span></label>
                    <input id="firstName" type="text" pInputText formControlName="firstName" placeholder="Enter your first name" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('firstName') }" />
                    <app-form-error [control]="getControl('firstName')" [isInvalid]="isInvalid('firstName')"></app-form-error>
                </div>
                
                <!-- Last Name -->
                <div>
                    <label class="form-label" for="lastName">Last Name <span class="required-asterisk">*</span></label>
                    <input id="lastName" type="text" pInputText formControlName="lastName" placeholder="Enter your last name" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('lastName') }" />
                    <app-form-error [control]="getControl('lastName')" [isInvalid]="isInvalid('lastName')"></app-form-error>
                </div>
                
                <!-- Email -->
                <div>
                    <label class="form-label" for="email">Email <span class="required-asterisk">*</span></label>
                    <input id="email" type="email" pInputText formControlName="email" placeholder="Enter your email" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('email') }" />
                    <app-form-error [control]="getControl('email')" [isInvalid]="isInvalid('email')"></app-form-error>
                </div>
            </div>

            <!-- Business Contact Details Section -->
            <h3 class="text-lg font-medium text-gray-800 mb-4 border-b pb-2">Business Contact Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Phone -->
                <div>
                    <label class="form-label" for="phone">Phone <span class="required-asterisk">*</span></label>
                    <input id="phone" type="text" pInputText formControlName="phone" placeholder="Enter phone number" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('phone') }" />
                    <app-form-error [control]="getControl('phone')" [isInvalid]="isInvalid('phone')"></app-form-error>
                </div>
                
                <!-- Street -->
                <div>
                    <label class="form-label" for="street">Street</label>
                    <input id="street" type="text" pInputText formControlName="street" placeholder="Enter street name" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('street') }" />
                    <app-form-error [control]="getControl('street')" [isInvalid]="isInvalid('street')"></app-form-error>
                </div>
                
                <!-- City -->
                <div>
                    <label class="form-label" for="city">City</label>
                    <input id="city" type="text" pInputText formControlName="city" placeholder="Enter city name" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('city') }" />
                    <app-form-error [control]="getControl('city')" [isInvalid]="isInvalid('city')"></app-form-error>
                </div>
                
                <!-- State -->
                <div>
                    <label class="form-label" for="province">State</label>
                    <input id="province" type="text" pInputText formControlName="province" placeholder="Enter province/state/county" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('province') }" />
                    <app-form-error [control]="getControl('province')" [isInvalid]="isInvalid('province')"></app-form-error>
                </div>
                
                <!-- Postal Code -->
                <div>
                    <label class="form-label" for="postalCode">Post Code/Zip Code/ P.O. Box</label>
                    <input id="postalCode" type="text" pInputText formControlName="postalCode" placeholder="Enter post code/zip code/P.O. box" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('postalCode') }" />
                    <app-form-error [control]="getControl('postalCode')" [isInvalid]="isInvalid('postalCode')"></app-form-error>
                </div>
            </div>

            <!-- Branch Information Section -->
            <h3 class="text-lg font-medium text-gray-800 mb-4 border-b pb-2">Branch Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <!-- Tenant Name -->
                <div>
                    <label class="form-label" for="tenantName">Branch name <span class="required-asterisk">*</span></label>
                    <input pInputText type="text" formControlName="tenantName" placeholder="Enter Tenant Legal Business Name" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('tenantName') }" />
                    <app-form-error [control]="getControl('tenantName')" [isInvalid]="isInvalid('tenantName')"></app-form-error>
                </div>
                
                <!-- BIN Number -->
                <div>
                    <label class="form-label" for="binNo">Branch Business Number</label>
                    <input pInputText type="text" formControlName="binNo" placeholder="Enter Tenant Business Number" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('binNo') }" />
                    <app-form-error [control]="getControl('binNo')" [isInvalid]="isInvalid('binNo')"></app-form-error>
                </div>
                
                <!-- Domain -->
                <div>
                    <label class="form-label" for="domain">Company Domain <span class="required-asterisk">*</span></label>
                    <input pInputText formControlName="domain" type="text" placeholder="Enter Company Domain" class="w-full" [ngClass]="{ 'p-invalid': isInvalid('domain') }" />
                    <app-form-error [control]="getControl('domain')" [isInvalid]="isInvalid('domain')"></app-form-error>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end gap-3 mt-8">
                <button pButton type="button" severity="secondary" class="!rounded-xl px-5 py-2" (click)="onCancel()">Cancel</button>
                <button pButton type="submit" severity="primary" class="!rounded-xl px-6 py-2">Register</button>
            </div>
        </form>
    </div>
</div>
