<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Financial Year Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/FinancialYear/get-financial-year-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="financialYearDialog" [style]="{width: '600px'}"
    [header]="isEditMode ? 'Edit Financial Year' : 'Add New Financial Year'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="financialYearForm" class="py-4">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Year Name -->
          <div class="field col-span-2 md:col-span-1">
            <label for="finYearName" class="block text-sm font-medium text-gray-700 mb-1">Financial Year Name <span
                class="text-red-500">*</span></label>
            <input type="text" pInputText id="finYearName" formControlName="finYearName" placeholder="e.g. 2026-2027"
              [ngClass]="{'ng-invalid ng-dirty': submitted && financialYearForm.controls['finYearName'].invalid}"
              class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500"
              *ngIf="submitted && financialYearForm.controls['finYearName'].hasError('required')">Name is
              required.</small>
          </div>

          <!-- Fin Code -->
          <div class="field col-span-2 md:col-span-1">
            <label for="finCode" class="block text-sm font-medium text-gray-700 mb-1">Fin Code <span
                class="text-red-500">*</span></label>
            <p-inputNumber id="finCode" formControlName="finCode" [useGrouping]="false" placeholder="Enter Fin Code"
              [ngClass]="{'ng-invalid ng-dirty': submitted && financialYearForm.controls['finCode'].invalid}"></p-inputNumber>
            <small class="text-red-500"
              *ngIf="submitted && financialYearForm.controls['finCode'].hasError('required')">Fin Code is
              required.</small>
          </div>

          <!-- From Date -->
          <div class="field col-span-2 md:col-span-1">
            <label for="fromDate" class="block text-sm font-medium text-gray-700 mb-1">From Date <span
                class="text-red-500">*</span></label>
            <p-calendar id="fromDate" formControlName="fromDate" appendTo="body" [showIcon]="true"
              placeholder="Select From Date"
              [ngClass]="{'ng-invalid ng-dirty': submitted && financialYearForm.controls['fromDate'].invalid}"></p-calendar>
            <small class="text-red-500"
              *ngIf="submitted && financialYearForm.controls['fromDate'].hasError('required')">From Date is
              required.</small>
          </div>

          <!-- To Date -->
          <div class="field col-span-2 md:col-span-1">
            <label for="toDate" class="block text-sm font-medium text-gray-700 mb-1">To Date <span
                class="text-red-500">*</span></label>
            <p-calendar id="toDate" formControlName="toDate" appendTo="body" [showIcon]="true"
              placeholder="Select To Date"
              [ngClass]="{'ng-invalid ng-dirty': submitted && financialYearForm.controls['toDate'].invalid}"></p-calendar>
            <small class="text-red-500"
              *ngIf="submitted && financialYearForm.controls['toDate'].hasError('required')">To Date is
              required.</small>
          </div>

          <!-- Remarks -->
          <div class="field col-span-2">
            <label for="remarks" class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <input type="text" pInputText id="remarks" formControlName="remarks" placeholder="Enter remarks"
              class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
          </div>

          <!-- Is Current -->
          <div class="field col-span-2 md:col-span-1 flex items-center mt-2">
            <p-checkbox formControlName="isCurrent" [binary]="true" inputId="isCurrent"></p-checkbox>
            <label for="isCurrent" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Current Year</label>
          </div>

          <!-- Is Active -->
          <div class="field col-span-2 md:col-span-1 flex items-center mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveFinancialYear()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
