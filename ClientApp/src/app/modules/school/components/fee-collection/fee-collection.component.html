<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Fee Collection Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/FeeCollection/get-fee-collection-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="feeCollectionDialog" [style]="{width: '1000px'}"
    [header]="isEditMode ? 'Edit Fee Collection' : 'Add New Fee Collection'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="feeCollectionForm" class="py-4">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <!-- Collection Date -->
          <div class="field">
            <label for="collectionDate" class="block text-sm font-medium text-gray-700 mb-1">Date <span
                class="text-red-500">*</span></label>
            <p-calendar id="collectionDate" formControlName="collectionDate" appendTo="body" [showIcon]="true"
              placeholder="Select Date"></p-calendar>
          </div>

          <!-- Memo No -->
          <div class="field">
            <label for="memoNo" class="block text-sm font-medium text-gray-700 mb-1">Memo No</label>
            <input type="text" pInputText id="memoNo" formControlName="memoNo" placeholder="Memo No" />
          </div>

          <!-- Payment Mode -->
          <div class="field">
            <label for="paymentMode" class="block text-sm font-medium text-gray-700 mb-1">Payment Mode</label>
            <p-dropdown id="paymentMode" [options]="paymentModes" formControlName="paymentMode" placeholder="Select Mode"></p-dropdown>
          </div>

          <!-- Status flags -->
          <div class="flex flex-col gap-2 pt-6">
            <div class="flex items-center">
              <p-checkbox formControlName="isCancelled" [binary]="true" inputId="isCancelled"></p-checkbox>
              <label for="isCancelled" class="ml-2 text-xs font-medium text-gray-700">Cancelled</label>
            </div>
            <div class="flex items-center">
              <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
              <label for="isActive" class="ml-2 text-xs font-medium text-gray-700">Active</label>
            </div>
          </div>

          <!-- Amounts -->
          <div class="field">
            <label for="totalAmount" class="block text-sm font-medium text-gray-700 mb-1">Total Amount</label>
            <p-inputNumber id="totalAmount" formControlName="totalAmount" mode="decimal" [minFractionDigits]="2"></p-inputNumber>
          </div>
          <div class="field">
            <label for="discountAmount" class="block text-sm font-medium text-gray-700 mb-1">Discount</label>
            <p-inputNumber id="discountAmount" formControlName="discountAmount" mode="decimal" [minFractionDigits]="2"></p-inputNumber>
          </div>
          <div class="field">
            <label for="paidAmount" class="block text-sm font-medium text-gray-700 mb-1">Paid Amount</label>
            <p-inputNumber id="paidAmount" formControlName="paidAmount" mode="decimal" [minFractionDigits]="2"></p-inputNumber>
          </div>
          <div class="field">
            <label for="dueAmount" class="block text-sm font-medium text-gray-700 mb-1">Due Amount</label>
            <p-inputNumber id="dueAmount" formControlName="dueAmount" mode="decimal" [minFractionDigits]="2"></p-inputNumber>
          </div>

          <div class="field col-span-4">
            <label for="remarks" class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <input type="text" pInputText id="remarks" formControlName="remarks" placeholder="Remarks" />
          </div>

          <!-- Details Section -->
          <div class="col-span-4 mt-4 border-t pt-4">
            <div class="flex justify-between items-center mb-3">
              <span class="text-lg font-semibold text-gray-800">Fee Head Breakdown</span>
              <p-button label="Add Row" icon="pi pi-plus" styleClass="p-button-sm p-button-outlined"
                (click)="addDetail()"></p-button>
            </div>

            <div formArrayName="details">
              <div *ngFor="let detail of details.controls; let i=index" [formGroupName]="i"
                class="grid grid-cols-12 gap-3 mb-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                <div class="col-span-3">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Fee Head</label>
                  <input type="text" pInputText formControlName="feeHeadId" placeholder="ID" />
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Month/Year</label>
                  <div class="flex gap-1">
                    <input type="text" pInputText formControlName="monthNo" placeholder="M" class="p-inputtext-sm" />
                    <input type="text" pInputText formControlName="yearNo" placeholder="Y" class="p-inputtext-sm" />
                  </div>
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Fee</label>
                  <p-inputNumber formControlName="feeAmount" mode="decimal" [minFractionDigits]="2" class="p-inputtext-sm"></p-inputNumber>
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Paid</label>
                  <p-inputNumber formControlName="paidAmount" mode="decimal" [minFractionDigits]="2" class="p-inputtext-sm"></p-inputNumber>
                </div>
                <div class="col-span-2">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Due</label>
                  <p-inputNumber formControlName="dueAmount" mode="decimal" [minFractionDigits]="2" class="p-inputtext-sm"></p-inputNumber>
                </div>
                <div class="col-span-1 text-right mt-4">
                  <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-text"
                    (click)="removeDetail(i)"></p-button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveFeeCollection()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
