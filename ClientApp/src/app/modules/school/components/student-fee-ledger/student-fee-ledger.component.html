<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Student Fee Ledger Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/StudentFeeLedger/get-student-fee-ledger-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="studentFeeLedgerDialog" [style]="{width: '800px'}"
    [header]="isEditMode ? 'Edit Ledger Entry' : 'Add New Ledger Entry'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="studentFeeLedgerForm" class="py-4">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Entry Date -->
          <div class="field">
            <label for="entryDate" class="block text-sm font-medium text-gray-700 mb-1">Entry Date <span
                class="text-red-500">*</span></label>
            <p-calendar id="entryDate" formControlName="entryDate" appendTo="body" [showIcon]="true"
              placeholder="Select Date"
              [ngClass]="{'ng-invalid ng-dirty': submitted && studentFeeLedgerForm.controls['entryDate'].invalid}"></p-calendar>
          </div>

          <!-- Memo No -->
          <div class="field">
            <label for="memoNo" class="block text-sm font-medium text-gray-700 mb-1">Memo No</label>
            <input type="text" pInputText id="memoNo" formControlName="memoNo" placeholder="Enter memo no" />
          </div>

          <!-- Fee Amount -->
          <div class="field">
            <label for="feeAmount" class="block text-sm font-medium text-gray-700 mb-1">Fee Amount <span
                class="text-red-500">*</span></label>
            <p-inputNumber id="feeAmount" formControlName="feeAmount" mode="decimal" [minFractionDigits]="2"
              placeholder="0.00"></p-inputNumber>
          </div>

          <!-- Collection Amount -->
          <div class="field">
            <label for="collectionAmount" class="block text-sm font-medium text-gray-700 mb-1">Collection Amount <span
                class="text-red-500">*</span></label>
            <p-inputNumber id="collectionAmount" formControlName="collectionAmount" mode="decimal" [minFractionDigits]="2"
              placeholder="0.00"></p-inputNumber>
          </div>

          <!-- Due Amount -->
          <div class="field">
            <label for="dueAmount" class="block text-sm font-medium text-gray-700 mb-1">Due Amount <span
                class="text-red-500">*</span></label>
            <p-inputNumber id="dueAmount" formControlName="dueAmount" mode="decimal" [minFractionDigits]="2"
              placeholder="0.00"></p-inputNumber>
          </div>

          <!-- Voucher Code -->
          <div class="field">
            <label for="voucherCode" class="block text-sm font-medium text-gray-700 mb-1">Voucher Code</label>
            <input type="text" pInputText id="voucherCode" formControlName="voucherCode" placeholder="Enter voucher code" />
          </div>

          <!-- Month No -->
          <div class="field">
            <label for="monthNo" class="block text-sm font-medium text-gray-700 mb-1">Month No</label>
            <p-inputNumber id="monthNo" formControlName="monthNo" [min]="1" [max]="12"></p-inputNumber>
          </div>

          <!-- Year No -->
          <div class="field">
            <label for="yearNo" class="block text-sm font-medium text-gray-700 mb-1">Year No</label>
            <p-inputNumber id="yearNo" formControlName="yearNo" [useGrouping]="false"></p-inputNumber>
          </div>

          <!-- Remarks -->
          <div class="field col-span-2">
            <label for="remarks" class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <input type="text" pInputText id="remarks" formControlName="remarks" placeholder="Enter remarks" />
          </div>

          <!-- Is Cancelled -->
          <div class="field flex items-center">
            <p-checkbox formControlName="isCancelled" [binary]="true" inputId="isCancelled"></p-checkbox>
            <label for="isCancelled" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Cancelled</label>
          </div>

          <!-- Is Active -->
          <div class="field flex items-center">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveStudentFeeLedger()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
