<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <!-- <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog> -->

  <div class="form-header">Student List Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/StudentInfo/get-student-user-list" [columns]="columns" [config]="tableConfig"
      (editClicked)="openEdit($event)"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="studentDialog" [style]="{width: '600px'}" header="Edit Student User Access" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="studentForm" class="py-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Student Code -->
          <div class="field">
            <label for="stdCID" class="block text-sm font-medium text-gray-700 mb-1">Student Code</label>
            <input type="text" pInputText id="stdCID" formControlName="stdCID" />
          </div>

          <!-- Student Name -->
          <div class="field">
            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
            <input type="text" pInputText id="fullName" formControlName="fullName" />
          </div>

          <!-- Password -->
          <div class="field col-span-1 md:col-span-2">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Set Password (leave blank to keep
              current)</label>
            <input type="password" pInputText id="password" formControlName="password" placeholder="New Password" />
          </div>

          <!-- Is Active -->
          <div class="field col-span-1 md:col-span-2 flex items-center mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary" (click)="saveStudent()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
