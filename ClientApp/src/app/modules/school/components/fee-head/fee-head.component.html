<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Fee Head Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/FeeHead/get-fee-head-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="feeHeadDialog" [style]="{width: '450px'}"
    [header]="isEditMode ? 'Edit Fee Head' : 'Add New Fee Head'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="feeHeadForm" class="py-4">

        <div class="grid grid-cols-1 gap-5">
          <!-- Fee Head Name -->
          <div class="field">
            <label for="feeHeadName" class="block text-sm font-medium text-gray-700 mb-1">Fee Head Name <span
                class="text-red-500">*</span></label>
            <input type="text" pInputText id="feeHeadName" formControlName="feeHeadName" placeholder="e.g. Tuition Fee"
              [ngClass]="{'ng-invalid ng-dirty': submitted && feeHeadForm.controls['feeHeadName'].invalid}"
              class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500"
              *ngIf="submitted && feeHeadForm.controls['feeHeadName'].hasError('required')">Name is
              required.</small>
          </div>

          <!-- Is Monthly -->
          <div class="field flex items-center mt-2">
            <p-checkbox formControlName="isMonthly" [binary]="true" inputId="isMonthly"></p-checkbox>
            <label for="isMonthly" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Monthly Fee</label>
          </div>

          <!-- Is Active -->
          <div class="field flex items-center mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveFeeHead()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
