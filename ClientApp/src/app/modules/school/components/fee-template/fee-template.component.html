<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Fee Template Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/FeeTemplate/get-fee-template-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="feeTemplateDialog" [style]="{width: '700px'}"
    [header]="isEditMode ? 'Edit Fee Template' : 'Add New Fee Template'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="feeTemplateForm" class="py-4">

        <div class="grid grid-cols-1 gap-5">
          <!-- Template Name -->
          <div class="field">
            <label for="templateName" class="block text-sm font-medium text-gray-700 mb-1">Template Name <span
                class="text-red-500">*</span></label>
            <input type="text" pInputText id="templateName" formControlName="templateName" placeholder="Template Name"
              [ngClass]="{'ng-invalid ng-dirty': submitted && feeTemplateForm.controls['templateName'].invalid}" />
          </div>

          <!-- Is Active -->
          <div class="field flex items-center">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>

          <!-- Details Section -->
          <div class="mt-4 border-t pt-4">
            <div class="flex justify-between items-center mb-3">
              <span class="text-lg font-semibold text-gray-800">Fee Details</span>
              <p-button label="Add Head" icon="pi pi-plus" styleClass="p-button-sm p-button-outlined"
                (click)="addDetail()"></p-button>
            </div>

            <div formArrayName="details">
              <div *ngFor="let detail of details.controls; let i=index" [formGroupName]="i"
                class="grid grid-cols-12 gap-3 mb-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                <div class="col-span-6">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Fee Head</label>
                  <input type="text" pInputText formControlName="feeHeadId" placeholder="Fee Head ID" />
                </div>
                <div class="col-span-4">
                  <label class="block text-xs font-medium text-gray-500 mb-1">Amount</label>
                  <p-inputNumber formControlName="amount" mode="decimal" [minFractionDigits]="2" placeholder="0.00"></p-inputNumber>
                </div>
                <div class="col-span-2 text-right mt-4">
                  <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-text"
                    (click)="removeDetail(i)"></p-button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveFeeTemplate()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
