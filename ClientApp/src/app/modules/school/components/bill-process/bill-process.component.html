<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>

  <div class="form-header">Bill Process</div>
  <div class="bg-white mx-auto p-6 rounded-lg shadow">
    <form [formGroup]="billProcessForm">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Admission -->
        <div class="field">
          <label for="admissionId" class="block text-sm font-medium text-gray-700 mb-1">Admission <span
              class="text-red-500">*</span></label>
          <p-dropdown id="admissionId" [options]="admissions" formControlName="admissionId" optionLabel="name"
            optionValue="id" placeholder="Select Admission" appendTo="body" styleClass="w-full"></p-dropdown>
        </div>

        <!-- Bill Month -->
        <div class="field">
          <label for="billMonth" class="block text-sm font-medium text-gray-700 mb-1">Bill Month <span
              class="text-red-500">*</span></label>
          <p-dropdown id="billMonth" [options]="months" formControlName="billMonth"
            placeholder="Select Month" appendTo="body" styleClass="w-full"></p-dropdown>
        </div>

        <!-- Bill Year -->
        <div class="field">
          <label for="billYear" class="block text-sm font-medium text-gray-700 mb-1">Bill Year <span
              class="text-red-500">*</span></label>
          <p-inputNumber id="billYear" formControlName="billYear" [useGrouping]="false"
            placeholder="Enter Year" styleClass="w-full"></p-inputNumber>
        </div>
      </div>

      <div class="flex justify-end mt-6">
        <p-button label="Process Bill" icon="pi pi-cog" styleClass="p-button-primary"
          [loading]="isProcessing" (click)="processBill()"></p-button>
      </div>
    </form>
  </div>
</div>
