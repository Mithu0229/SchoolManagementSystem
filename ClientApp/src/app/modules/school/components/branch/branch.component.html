<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Branch Management</div>
  <div class="bg-white mx-auto">
      <app-table apiUrl="/branch/get-branch-list" [columns]="columns" [config]="tableConfig" (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="branchDialog" [style]="{width: '600px'}" [header]="isEditMode ? 'Edit Branch' : 'Add New Branch'" [modal]="true" styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="branchForm" class="py-4">
        
        <!-- Image Upload Section -->
        <div class="flex flex-col items-center justify-center mb-8">
          <div class="relative group">
            <div class="w-32 h-32 rounded-full overflow-hidden bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center mb-4 transition-all group-hover:border-blue-500 shadow-sm relative">
              <img *ngIf="previewImage" [src]="previewImage" alt="Theme Preview" class="w-full h-full object-cover" />
              <div *ngIf="!previewImage" class="flex flex-col items-center text-gray-400">
                <i class="pi pi-cloud-upload text-3xl mb-1"></i>
                <span class="text-xs font-medium">Upload Image</span>
              </div>
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer" onclick="document.getElementById('fileUpload').click()">
                <i class="pi pi-camera text-white text-2xl"></i>
              </div>
            </div>
            <input type="file" id="fileUpload" class="hidden" accept="image/*" (change)="onFileSelected($event)">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Institute Dropdown -->
          <div class="field col-span-2">
            <label for="instituteId" class="block text-sm font-medium text-gray-700 mb-1">Institute <span class="text-red-500">*</span></label>
            <p-dropdown [options]="institutes" formControlName="instituteId" optionLabel="instituteName" optionValue="id" placeholder="Select an Institute" [ngClass]="{'ng-invalid ng-dirty': submitted && branchForm.controls['instituteId'].invalid}"></p-dropdown>
            <small class="text-red-500" *ngIf="submitted && branchForm.controls['instituteId'].hasError('required')">Institute is required.</small>
          </div>

          <!-- Branch Name -->
          <div class="field col-span-2">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Branch Name <span class="text-red-500">*</span></label>
            <input type="text" pInputText id="name" formControlName="branchName" placeholder="Enter branch name" [ngClass]="{'ng-invalid ng-dirty': submitted && branchForm.controls['branchName'].invalid}" class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500" *ngIf="submitted && branchForm.controls['branchName'].hasError('required')">Name is required.</small>
          </div>

          <!-- Contact Person -->
          <div class="field">
            <label for="contactPerson" class="block text-sm font-medium text-gray-700 mb-1">Contact Person <span class="text-red-500">*</span></label>
            <input type="text" pInputText id="contactPerson" formControlName="contactPerson" placeholder="Enter contact person" [ngClass]="{'ng-invalid ng-dirty': submitted && branchForm.controls['contactPerson'].invalid}" class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500" *ngIf="submitted && branchForm.controls['contactPerson'].hasError('required')">Contact Person is required.</small>
          </div>

          <!-- Contact Number -->
          <div class="field">
            <label for="contactNumber" class="block text-sm font-medium text-gray-700 mb-1">Contact No <span class="text-red-500">*</span></label>
            <input type="text" pInputText id="contactNumber" formControlName="contactNumber" placeholder="+1 234 567 8900" [ngClass]="{'ng-invalid ng-dirty': submitted && branchForm.controls['contactNumber'].invalid}" class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500" *ngIf="submitted && branchForm.controls['contactNumber'].hasError('required')">Contact Number is required.</small>
          </div>

          <!-- Branch Address -->
          <div class="field col-span-2">
            <label for="branchAddress" class="block text-sm font-medium text-gray-700 mb-1">Address <span class="text-red-500">*</span></label>
            <input type="text" pInputText id="branchAddress" formControlName="branchAddress" placeholder="Enter full address" [ngClass]="{'ng-invalid ng-dirty': submitted && branchForm.controls['branchAddress'].invalid}" class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500" *ngIf="submitted && branchForm.controls['branchAddress'].hasError('required')">Address is required.</small>
          </div>

          <!-- Is Active -->
          <div class="field col-span-2 flex items-center mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active Branch</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary" (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary" (click)="saveBranch()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
