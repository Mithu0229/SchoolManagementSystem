<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

  <div class="form-header">Academic Class Management</div>
  <div class="bg-white mx-auto">
    <app-table apiUrl="/AcademicClass/get-academic-class-list" [columns]="columns" [config]="tableConfig"
      (actionClicked)="openNew()"></app-table>
  </div>

  <!-- Dialog Section -->
  <p-dialog [(visible)]="academicClassDialog" [style]="{width: '500px'}"
    [header]="isEditMode ? 'Edit Academic Class' : 'Add New Academic Class'" [modal]="true"
    styleClass="p-fluid rounded-xl overflow-hidden shadow-2xl">
    <ng-template pTemplate="content">
      <form [formGroup]="academicClassForm" class="py-4">

        <div class="grid grid-cols-1 gap-5">
          <!-- Class Name -->
          <div class="field">
            <label for="className" class="block text-sm font-medium text-gray-700 mb-1">Class Name <span
                class="text-red-500">*</span></label>
            <input type="text" pInputText id="className" formControlName="className" placeholder="e.g. Class 10"
              [ngClass]="{'ng-invalid ng-dirty': submitted && academicClassForm.controls['className'].invalid}"
              class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
            <small class="text-red-500"
              *ngIf="submitted && academicClassForm.controls['className'].hasError('required')">Name is
              required.</small>
          </div>

          <!-- Class Details -->
          <div class="field">
            <label for="classDetails" class="block text-sm font-medium text-gray-700 mb-1">Class Details</label>
            <input type="text" pInputText id="classDetails" formControlName="classDetails" placeholder="Enter details"
              class="w-full p-3 rounded-lg border-gray-300 shadow-sm" />
          </div>

          <!-- Is Active -->
          <div class="field flex items-center mt-2">
            <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive"></p-checkbox>
            <label for="isActive" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">Active</label>
          </div>
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <div class="flex gap-2 justify-end border-t border-gray-100 pt-4">
        <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-text p-button-secondary"
          (click)="hideDialog()"></p-button>
        <p-button label="Save" icon="pi pi-check" styleClass="p-button-primary"
          (click)="saveAcademicClass()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
